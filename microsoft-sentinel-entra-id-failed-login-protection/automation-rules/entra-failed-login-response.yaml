# microsoft sentinel automation rule
# entra id failed login response
#
# purpose:
#   automatically process incidents generated by the
#   "entra id multiple failed sign-ins" analytics rule.
#
# trigger:
#   when a new sentinel incident is created by the
#   entra failed-login analytics rule.
#
# action:
#   start the entra failed login response playbook.
#
# security model:
#   detection  -> analytics rule
#   automation -> this automation rule
#   response   -> logic app / playbook
#
# important:
#   this rule does not directly disable the user.
#   the playbook decides whether additional response is justified.

id: "<GENERATE-GUID-AT-DEPLOYMENT>"

name: Entra Failed Login - Automated Response

description: |
  automatically invokes the Entra Failed Login Response playbook
  when an incident is created by the Entra ID multiple failed
  sign-ins analytics rule.

  the automation is intentionally separated from the detection
  rule so that detection logic and response logic can be modified
  independently.

  the playbook should enrich the incident, identify the affected
  account, collect authentication context, and determine whether
  additional response is appropriate.

triggeringLogic:
  triggers:
    - type: IncidentCreated

actions:
  - order: 1
    actionType: RunPlaybook
    playbookName: Entra-FailedLogin-Response
    playbookResourceGroup: "<PLAYBOOK-RESOURCE-GROUP>"
    playbookSubscriptionId: "<AZURE-SUBSCRIPTION-ID>"

conditions:
  - property: AnalyticsRuleName
    operator: Equals
    value: Entra ID multiple failed sign-ins

incidentConfiguration:
  createIncident: true

enabled: true

version: 1.0.0
